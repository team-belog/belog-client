name: Slack notifications

on:
  pull_request_target:
    types: [opened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  repository_dispatch:
    types: [vercel.deployment.promoted, vercel.deployment.error, vercel.deployment.failed]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      ((github.event.action != 'closed' && !github.event.pull_request.draft) ||
       (github.event.action == 'closed' && github.event.pull_request.merged))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency: &pr-notification-queue
      group: slack-pr-${{ github.event.pull_request.number }}
      queue: max
    steps:
      - name: Notify Slack about PR creation or merge
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
        with:
          script: &notify-pr-script |
            const { eventName, payload, repo } = context;
            const pr = payload.pull_request;
            const closed = payload.action === 'closed';
            const reviewing = eventName === 'pull_request_review';
            const issue = { ...repo, issue_number: pr.number };
            const marker = /^<!-- belog-slack-thread: ([CG][A-Z0-9]+) ([0-9]+\.[0-9]+) -->$/m;
            const mergeMarker = '<!-- belog-slack-merge-notified -->';
            const wait = (seconds) => new Promise((resolve) => setTimeout(resolve, seconds * 1000));
            const escape = (value) => String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');

            const retryGitHub = async (request) => {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  return await request(attempt);
                } catch (error) {
                  const status = error.status;
                  const retryAfter = error.response?.headers?.['retry-after'];
                  const rateLimited = status === 429 || (status === 403 && retryAfter != null);
                  const retryable = rateLimited || status >= 500 ||
                    ['ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN'].includes(error.code);
                  const seconds = rateLimited ? Number(retryAfter ?? NaN) : attempt;
                  if (!retryable || attempt === 3 ||
                      !Number.isFinite(seconds) || seconds < 0 || seconds > 60) throw error;
                  await wait(seconds);
                }
              }
            };
            const findThreadComment = async () => {
              const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
              return comments.find((comment) =>
                comment.user?.login === 'github-actions[bot]' && marker.test(comment.body ?? '')
              );
            };
            let saved = await retryGitHub(findThreadComment);
            if (process.env.WAIT_FOR_SLACK_THREAD === 'true') {
              // Wait outside the PR queue so the opening job can save the thread.
              for (const seconds of [5, 10, 15]) {
                if (saved || pr.draft) break;
                await wait(seconds);
                saved = await retryGitHub(findThreadComment);
              }
              return;
            }
            if (reviewing && !saved) {
              core.warning('원본 Slack 스레드 정보가 없어 리뷰 알림을 건너뜁니다.');
              return;
            }
            if (closed && !saved) {
              core.info('원본 Slack 스레드 정보가 없어 머지 알림을 건너뜁니다.');
              return;
            }
            if (!reviewing && saved?.body.includes(mergeMarker)) {
              core.info('이미 머지 답글을 발송한 PR입니다.');
              return;
            }

            const token = process.env.SLACK_BOT_TOKEN;
            const auth = { Authorization: 'Bearer ' + token };
            const postMessage = async (message) => {
              if (!token) throw new Error('SLACK_BOT_TOKEN is not configured');
              for (let attempt = 1; attempt <= 3; attempt++) {
                const response = await fetch('https://slack.com/api/chat.postMessage', {
                  method: 'POST',
                  headers: { ...auth, 'Content-Type': 'application/json' },
                  body: JSON.stringify(message),
                  signal: AbortSignal.timeout(10000),
                });
                if (response.ok) {
                  const result = await response.json();
                  if (!result.ok) throw new Error('Slack API 전송 실패 (' + result.error + ')');
                  return result;
                }
                const retryAfter = response.headers.get('retry-after');
                const seconds = retryAfter === null ? attempt : Number(retryAfter);
                if (response.status !== 429 || attempt === 3 ||
                    !Number.isFinite(seconds) || seconds < 0 || seconds > 60) {
                  throw new Error('Slack API 전송 실패 (HTTP ' + response.status + ')');
                }
                await wait(seconds);
              }
            };

            if (reviewing) {
              const review = payload.review;
              const labels = { approved: '승인', changes_requested: '변경 요청', commented: '의견' };
              let commentCount = '확인 불가';
              try {
                const comments = await github.paginate(github.rest.pulls.listCommentsForReview, {
                  ...repo,
                  pull_number: pr.number,
                  review_id: review.id,
                  per_page: 100,
                });
                commentCount = comments.length + '개';
              } catch (error) {
                core.warning('인라인 댓글 수를 조회하지 못했습니다: ' + error.message);
              }
              const text = [
                '💬 *[FE] PR 리뷰가 등록됐어요*',
                '*PR*  ' + escape(pr.title) + ' (#' + pr.number + ')',
                '*리뷰어*  ' + escape(review.user.login),
                '*결과*  ' + escape(labels[review.state.toLowerCase()] ?? review.state),
                '*인라인 댓글*  ' + commentCount,
                '<' + (review.html_url || pr.html_url) + '|리뷰 확인하기>',
              ].join('\n');
              const [, channel, threadTs] = saved.body.match(marker);
              await postMessage({ channel, thread_ts: threadTs, text });
              return;
            }

            if (!saved) {
              const channelId = process.env.SLACK_CHANNEL_ID;
              if (!channelId) throw new Error('SLACK_CHANNEL_ID is not configured');
              const text = [
                '📬 *[FE] PR이 등록됐어요*',
                '*제목*  ' + escape(pr.title) + ' (#' + pr.number + ')',
                '*작성자*  ' + escape(pr.user.login),
                '*대상 브랜치*  ' + escape(pr.base.ref),
                '<' + pr.html_url + '|PR 확인하기>',
              ].join('\n');
              const { channel, ts } = await postMessage({ channel: channelId, text });
              const threadMarker = '<!-- belog-slack-thread: ' + channel + ' ' + ts + ' -->';
              if (!marker.test(threadMarker)) {
                throw new Error('Slack 응답에 유효한 채널 ID 또는 메시지 ID가 없습니다.');
              }

              let body = 'Slack PR 알림을 보냈어요.';
              try {
                const query = new URLSearchParams({ channel, message_ts: ts });
                const response = await fetch('https://slack.com/api/chat.getPermalink?' + query, {
                  headers: auth,
                  signal: AbortSignal.timeout(5000),
                });
                const result = await response.json();
                if (!response.ok || !result.ok || !result.permalink) throw new Error();
                body = '[Slack 알림 스레드](' + result.permalink + ')';
              } catch {
                core.warning('Slack 스레드 링크를 조회하지 못했습니다. 스레드 ID는 저장합니다.');
              }
              body += '\n\n' + threadMarker;

              try {
                saved = await retryGitHub(async (attempt) => {
                  // GitHub may have created the comment before returning an error.
                  const existing = attempt > 1 ? await findThreadComment() : undefined;
                  if (existing) return existing;
                  const { data } = await github.rest.issues.createComment({ ...issue, body });
                  return data;
                });
              } catch (error) {
                core.error('Slack 원본 알림은 발송됐지만 스레드 기록을 저장하지 못했습니다. '
                  + 'PR #' + pr.number + ', 채널 ' + channel + ', 메시지 ID ' + ts);
                throw error;
              }
            }

            // The close job may have run before the opening job reached the queue.
            if (!closed) {
              const { data } = await retryGitHub(() => github.rest.pulls.get({ ...repo, pull_number: pr.number }));
              if (!data.merged) return;
            }

            const [, channel, threadTs] = saved.body.match(marker);
            await postMessage({ channel, thread_ts: threadTs, text: '🎉 *PR이 머지되었어요!*' });
            try {
              await retryGitHub(() => github.rest.issues.updateComment({
                ...repo,
                comment_id: saved.id,
                body: saved.body + '\n' + mergeMarker,
              }));
            } catch (error) {
              core.error('Slack 머지 답글은 발송됐지만 완료 기록을 저장하지 못했습니다. '
                + '재실행 전에 스레드를 확인하세요. PR #' + pr.number + ', 채널 ' + channel + ', 스레드 ID ' + threadTs);
              throw error;
            }

  wait-for-pr-thread:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Wait for the PR Slack thread
        uses: actions/github-script@v7
        env:
          WAIT_FOR_SLACK_THREAD: 'true'
        with:
          script: *notify-pr-script

  notify-review:
    needs: wait-for-pr-thread
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    concurrency: *pr-notification-queue
    steps:
      - name: Reply to the PR Slack thread
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          script: *notify-pr-script

  notify:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.git.ref == 'main' &&
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.name == 'belog-client'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const webhookUrl = process.env.SLACK_WEBHOOK_URL;
            if (!webhookUrl) {
              throw new Error('SLACK_WEBHOOK_URL is not configured or is unavailable for this event');
            }

            const escape = (value) => String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
            const { payload, repo } = context;
            const deployment = payload.client_payload;
            const success = payload.action === 'vercel.deployment.promoted';
            const commitUrl = `https://github.com/${repo.owner}/${repo.repo}/commit/${deployment.git.sha}`;
            const text = [
              `${success ? '✅' : '🚨'} *[FE] 운영 배포 ${success ? '성공' : '실패'}*`,
              '*브랜치*  main',
              `*커밋*  <${commitUrl}|${escape(deployment.git.shortSha || deployment.git.sha.slice(0, 7))}>`,
            ].join('\n');

            const maxAttempts = 3;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
                signal: AbortSignal.timeout(10000),
              });
              if (response.ok) break;

              const retryable = response.status === 429 || response.status >= 500;
              if (!retryable || attempt === maxAttempts) {
                throw new Error(`Slack 알림 전송 실패 (HTTP ${response.status})`);
              }

              const retryAfter = response.headers.get('retry-after');
              const seconds = retryAfter === null ? 2 ** (attempt - 1) : Number(retryAfter);
              if (!Number.isFinite(seconds) || seconds < 0 || seconds > 60) {
                throw new Error(`Slack 재시도 대기 시간이 유효 범위를 벗어났습니다 (HTTP ${response.status})`);
              }
              await new Promise((resolve) => setTimeout(resolve, seconds * 1000));
            }
